<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Details Modal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="project7.css">
</head>
<body class="bg-light p-4">

    <!-- Eye Button -->
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#upiDetailsModal">
         UPI Details <i class="fa-solid fa-eye"></i>
    </button>

    <!-- UPI Details Modal -->
    <div class="modal fade" id="upiDetailsModal" tabindex="-1" aria-labelledby="upiDetailsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="upiDetailsModalLabel">UPI Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-borderless">
                        <tr>
                            <th>UPI Accountant Name</th>
                            <td>RVM CHARITABLE TRUST HOSPITAL</td>
                        </tr>
                        <tr>
                            <th>UPI Name</th>
                            <td>Phone Pay</td>
                        </tr>
                        <tr>
                            <th>UPI ID</th>
                            <td>303915535034685@cnrb</td>
                        </tr>
                        <tr>
                            <th>UPI Phone Number</th>
                            <td>6281442328</td>
                        </tr>
                        <tr>
                            <th>UPI QR Code</th>
                            <td><img src="QR Code img.png.png" class="img-fluid rounded" alt="QR Code"></td>
                        </tr>
                        <tr>
                            <th>Account Status</th>
                            <td><span class="badge bg-success">Active</span></td>
                        </tr>
                        <tr>
                            <th>Created On</th>
                            <td>25-08-2025 01:43 PM</td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
