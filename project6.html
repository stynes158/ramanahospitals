<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create UPI Form</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
      font-family: Arial, sans-serif;
    }
    .modal-header {
      background-color: #3b5998;
      color: white;
    }
    .modal-content {
      border-radius: 12px;
      box-shadow: 0px 4px 20px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body class="p-4">

  <!-- Button to Open Modal -->
  <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#upiModal">
   <a href="Project14.html"></a> Create UPI 
  </button>

  <!-- Modal -->
  <div class="modal fade" id="upiModal" tabindex="-1" aria-labelledby="upiModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <!-- Modal Header -->
        <div class="modal-header">
          <h5 class="modal-title" id="upiModalLabel">Create Accounts & Finance</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <!-- Modal Body with Form -->
        <div class="modal-body">
          <form id="upiForm">
            <div class="mb-3">

              <label class="form-label">UPI Accountant Name *</label>
              <input type="text" class="form-control" placeholder="Enter The UPI Accountant Name" required>
            </div>

            <div class="mb-3">
              <label class="form-label">UPI Name *</label>
              <select class="form-select" required>
                <option value="">Select UPI Name</option>
                <option value="GooglePay">Google Pay</option>
                <option value="PhonePe">PhonePe</option>
                <option value="Paytm">Paytm</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">UPI ID <span class="text-red-500">*</span></label>
              <input type="text" class="form-control" placeholder="Enter The UPI ID" required>
            </div>

            <div class="mb-3">
              <label class="form-label">UPI Phone Number *</label>
              <input type="tel" class="form-control" placeholder="UPI Phone Number" required>
            </div>

            <div class="mb-3">
              <label class="form-label">UPI QR Code Image *</label>
              <input type="file" class="form-control" required>
            </div>
            
            <div class="text-center">
              <button type="submit" class="btn btn-primary w-100">Save</button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JavaScript to Handle Form Submit -->
  <script>
    document.getElementById("upiForm").addEventListener("submit", function(event){
      event.preventDefault();
      alert("UPI Details Saved Successfully!");
      var modal = bootstrap.Modal.getInstance(document.getElementById('upiModal'));
      modal.hide(); // Close modal after save
    });
  </script>

</body>
</html>
